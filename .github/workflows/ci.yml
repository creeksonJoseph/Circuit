name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (matcher, types, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Solana CLI (Agave 4.1.2)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 1.2.2
        run: |
          cargo install anchor-cli --version 1.2.2 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Anchor program
        run: anchor build --arch v3 --tools-version v1.57

      - name: Typecheck
        run: npm run typecheck

      - name: Matcher unit tests
        run: npm run test:matcher

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p circuit --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p circuit

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest

  program-build:
    name: Anchor program build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI (Agave 4.1.2)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 1.2.2
        run: |
          cargo install anchor-cli --version 1.2.2 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build program
        run: anchor build --arch v3 --tools-version v1.57

      - name: Verify build output
        run: test -f target/deploy/circuit.so

  # Integration tests need a running validator and a funded wallet. Run them on
  # a self-hosted runner or in a dedicated job once validator orchestration is
  # added to CI. Local command:
  #   NO_DNA=1 anchor test --validator legacy
